# main 브랜치에 머지(push)되면 화면을 빌드해서 S3에 올리고 CloudFront 캐시를 무효화한다.
# AWS 키를 저장하지 않고 OIDC로 임시 자격 증명을 받는다. 역할은 이 저장소의 main 브랜치 실행만 받을 수 있다(백엔드 저장소의 terraform/envs/prod.tfvars의 frontend_deploy_branch).
#
# 저장소 변수(Settings → Secrets and variables → Actions → Variables)에 아래 값을 넣어야 한다.
#   AWS_ROLE_ARN                  terraform output -raw frontend_deploy_role_arn
#   S3_BUCKET                     terraform output -raw frontend_bucket
#   CLOUDFRONT_DISTRIBUTION_ID    terraform output -raw frontend_distribution_id
#   VITE_PORTONE_STORE_ID, VITE_PORTONE_BILLING_CHANNEL_KEY, VITE_PORTONE_PAYMENT_CHANNEL_KEY,
#   VITE_GOOGLE_CLIENT_ID, VITE_KAKAO_CLIENT_ID    .env에 넣던 값 (브라우저에 그대로 내려가는 공개 값이라 비밀이 아니다)
# VITE_API_BASE_URL은 비워 둔다. 같은 도메인에서 /api 로 요청하면 CloudFront가 백엔드로 보낸다.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC로 AWS 역할을 받으려면 id-token 쓰기 권한이 필요하다
permissions:
  id-token: write
  contents: read

# 연달아 머지돼도 배포가 동시에 돌지 않게 한다 (먼저 돌던 배포는 끝까지 마친다)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 외부 액션은 태그가 아니라 커밋 SHA로 고정한다 (태그는 나중에 다른 코드로 옮길 수 있음)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # 의존성의 설치 스크립트(postinstall 등)를 돌리지 않는다. 이 job은 AWS 역할을 받으므로 패키지가 설치 중에 코드를 실행하지 못하게 막는다
      - run: npm ci --ignore-scripts

      # 변수를 등록하지 않으면 빈 값으로 빌드돼 배포는 성공하고 화면에서만 결제·소셜 로그인이 안 된다. 빌드 전에 멈춘다
      - name: 필수 변수 확인
        env:
          VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_BILLING_CHANNEL_KEY: ${{ vars.VITE_PORTONE_BILLING_CHANNEL_KEY }}
          VITE_PORTONE_PAYMENT_CHANNEL_KEY: ${{ vars.VITE_PORTONE_PAYMENT_CHANNEL_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID }}
        run: |
          missing=0
          for name in VITE_PORTONE_STORE_ID VITE_PORTONE_BILLING_CHANNEL_KEY VITE_PORTONE_PAYMENT_CHANNEL_KEY VITE_GOOGLE_CLIENT_ID VITE_KAKAO_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::저장소 변수 $name 이(가) 비어 있습니다"
              missing=1
            fi
          done
          exit $missing

      # Vite는 VITE_ 변수를 빌드할 때 코드 안에 넣어 버린다. 그래서 배포된 화면의 값을 바꾸려면 다시 빌드해야 한다
      - run: npm run build
        env:
          VITE_API_BASE_URL: ""
          VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_BILLING_CHANNEL_KEY: ${{ vars.VITE_PORTONE_BILLING_CHANNEL_KEY }}
          VITE_PORTONE_PAYMENT_CHANNEL_KEY: ${{ vars.VITE_PORTONE_PAYMENT_CHANNEL_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID }}

      # 빌드가 비었거나 실패했는데 --delete로 버킷을 비워 버리는 사고를 막는다
      - name: 빌드 결과 확인
        run: test -f dist/index.html

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 파일 이름에 해시가 붙은 정적 파일은 오래 캐시한다. index.html은 마지막에 올려서, 새 index.html이 가리키는 파일이 먼저 올라가 있게 한다
      - name: S3에 업로드
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" --cache-control "no-cache"

      # index.html만 새로 받게 하면 나머지 파일은 이름이 바뀌므로 따로 지울 필요가 없다
      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths /index.html
